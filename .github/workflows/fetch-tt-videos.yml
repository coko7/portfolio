name: Fetch latest Terminal Tuesday videos

on:
  schedule:
    # every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # https://www.youtube.com/@TerminalCollectiveOrg
      CHANNEL_ID: UCuxDrxscs0N-EmpXspDdhRg
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Fetch and parse XML feed
        run: ./scripts/parse-yt-feed.sh

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-3-tty-videos.json
          git diff --staged --quiet || git commit -m "chore: auto fetched latest TT videos"
          git push
