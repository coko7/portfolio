name: Fetch latest Terminal Tuesday videos

on:
  schedule:
    # every week, Wednesday 00:00 UTC (day after Terminal Tuesday)
    - cron: '0 0 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  # needed for `gh workflow run` to dispatch another workflow
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # https://www.youtube.com/@TerminalCollectiveOrg
      CHANNEL_ID: UCuxDrxscs0N-EmpXspDdhRg
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Fetch and parse XML feed
        run: ./scripts/parse-yt-feed.sh

      - name: Commit changes if any
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-3-tt-videos.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto fetched latest TT videos"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
